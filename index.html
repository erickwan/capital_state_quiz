<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fifty Plates</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: one left-aligned column; a license plate is the study card, controls sit under it. */
:root {
  --bg: #EDF1F6;
  --surface: #FAFBFD;
  --plate: #FDFDF8;
  --ink: #14284B;
  --muted: #586A86;
  --line: #C9D3E0;
  --accent: #0B6B4F;
  --accent-ink: #FFFFFF;
  --good: #1B7A4B;
  --good-bg: #DDF1E5;
  --bad: #B3362B;
  --bad-bg: #F8DFDB;
  --display: "Barlow Condensed", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --body: "Barlow", "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D1625; --surface: #152136; --plate: #1B2A44; --ink: #E8EDF6; --muted: #9BAAC2;
    --line: #2B3C59; --accent: #45B98D; --accent-ink: #05241A; --good: #55C992; --good-bg: #12382A;
    --bad: #F28478; --bad-bg: #44201D; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D1625; --surface: #152136; --plate: #1B2A44; --ink: #E8EDF6; --muted: #9BAAC2;
  --line: #2B3C59; --accent: #45B98D; --accent-ink: #05241A; --good: #55C992; --good-bg: #12382A;
  --bad: #F28478; --bad-bg: #44201D; color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0;
  background: var(--bg); color: var(--ink);
  font-family: var(--body); font-size: 16px; line-height: 1.45;
}
.wrap {
  max-width: 720px; margin: 0 auto; padding-block: 28px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 22px;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

/* Header */
.head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 24px; }
h1 {
  font-family: var(--display); font-weight: 700; font-size: 2.5rem; line-height: 1;
  letter-spacing: 0.02em; text-transform: uppercase; margin: 0; text-wrap: balance;
}
.sub { color: var(--muted); margin: 6px 0 0; }
.meter { min-width: 220px; flex: 1 1 220px; max-width: 300px; display: flex; flex-direction: column; gap: 6px; }
.meter-row { display: flex; justify-content: space-between; gap: 12px; font-size: 0.875rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.meter-row strong { color: var(--ink); font-weight: 600; }
.bar { height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .3s; }

/* Tabs */
.tabs { display: flex; gap: 4px; border-bottom: 2px solid var(--line); overflow-x: auto; }
.tab {
  background: none; border: 0; padding: 10px 14px; margin-bottom: -2px;
  font-family: var(--display); font-weight: 600; font-size: 1.125rem; letter-spacing: 0.06em; text-transform: uppercase;
  color: var(--muted); border-bottom: 3px solid transparent; white-space: nowrap;
}
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }

/* Filters */
.filters { display: flex; flex-direction: column; gap: 10px; }
.frow { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.flabel {
  font-size: 0.75rem; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--muted); width: 64px; flex: none;
}
.chip {
  background: var(--surface); border: 1.5px solid var(--line); border-radius: 999px;
  padding: 5px 13px; font-size: 0.9375rem; font-weight: 500;
}
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }

/* Plate */
.plate {
  position: relative; width: 100%; background: var(--plate); color: var(--ink);
  border: 3px solid var(--ink); border-radius: 18px; padding: 30px 20px 18px;
  box-shadow: inset 0 0 0 5px var(--plate), inset 0 0 0 6px var(--line);
  text-align: center; display: flex; flex-direction: column; align-items: center; gap: 8px;
  min-height: 290px; justify-content: center;
}
button.plate { cursor: pointer; }
.plate::before, .plate::after {
  content: ""; position: absolute; top: 14px; width: 12px; height: 12px; border-radius: 50%;
  background: var(--bg); border: 2px solid var(--line);
}
.plate::before { left: 22%; } .plate::after { right: 22%; }
.p-ask { font-size: 0.8125rem; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.p-main {
  font-family: var(--display); font-weight: 700; text-transform: uppercase; letter-spacing: 0.03em;
  font-size: clamp(2.25rem, 10vw, 4rem); line-height: 1; text-wrap: balance; overflow-wrap: anywhere;
}
.p-rule { width: 56px; height: 3px; background: var(--line); border-radius: 2px; margin: 6px 0; }
.p-ans {
  font-family: var(--display); font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em;
  font-size: clamp(1.5rem, 6.5vw, 2.25rem); line-height: 1.05; color: var(--accent); text-wrap: balance; min-height: 1.05em;
}
.p-ans.wait { color: var(--muted); font-size: 1rem; font-family: var(--body); font-weight: 500; text-transform: none; letter-spacing: 0; }
.p-foot { font-size: 0.875rem; color: var(--muted); min-height: 1.3em; }

/* Controls under the plate */
.controls { display: flex; flex-direction: column; gap: 12px; }
.btnrow { display: flex; flex-wrap: wrap; gap: 10px; }
.btn {
  flex: 1 1 140px; padding: 13px 16px; border-radius: 10px; border: 1.5px solid var(--line);
  background: var(--surface); font-weight: 600; font-size: 1rem; text-align: center;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.yes { border-color: var(--good); color: var(--good); }
.btn.no { border-color: var(--bad); color: var(--bad); }
.opts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.opt {
  display: flex; align-items: center; gap: 10px; text-align: left; padding: 13px 14px;
  border-radius: 10px; border: 1.5px solid var(--line); background: var(--surface); font-weight: 500; min-width: 0;
}
.opt kbd { font-family: var(--display); font-weight: 600; font-size: 0.9375rem; color: var(--muted); border: 1.5px solid var(--line); border-radius: 5px; padding: 0 6px; flex: none; }
.opt.right { border-color: var(--good); background: var(--good-bg); }
.opt.wrong { border-color: var(--bad); background: var(--bad-bg); }
.opt:disabled { cursor: default; }
.typeform { display: flex; flex-wrap: wrap; gap: 10px; }
.typeform input {
  flex: 3 1 220px; min-width: 0; padding: 13px 14px; border-radius: 10px; border: 1.5px solid var(--line);
  background: var(--surface); font-size: 1.0625rem;
}
.typeform .btn { flex: 1 1 110px; }
.verdict { font-weight: 600; min-height: 1.45em; }
.verdict.good { color: var(--good); } .verdict.bad { color: var(--bad); }
.hint { font-size: 0.8125rem; color: var(--muted); }
@media (max-width: 480px) { .opts { grid-template-columns: 1fr; } .hint.keys { display: none; } }

/* Reference list */
.listbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.listbar input { flex: 1 1 200px; min-width: 0; padding: 9px 12px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--surface); }
.tablebox { overflow-x: auto; border: 1.5px solid var(--line); border-radius: 12px; background: var(--surface); }
table { width: 100%; border-collapse: collapse; font-size: 0.9375rem; }
th {
  text-align: left; font-size: 0.75rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted);
  padding: 10px 12px; border-bottom: 1.5px solid var(--line);
}
td { padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
td.st { font-weight: 600; }
.pip { display: inline-block; width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid var(--muted); margin-right: 8px; vertical-align: 1px; }
.pip.b1, .pip.b2 { border-color: var(--accent); background: linear-gradient(to top, var(--accent) 50%, transparent 50%); }
.pip.b3 { border-color: var(--accent); background: var(--accent); }
.cover { border: 1.5px dashed var(--line); background: var(--bg); color: var(--muted); border-radius: 6px; padding: 1px 12px; font-size: 0.8125rem; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 18px; align-items: center; justify-content: space-between; font-size: 0.8125rem; color: var(--muted); }
.legend span { white-space: nowrap; }
.linkbtn { background: none; border: 0; padding: 0; color: var(--muted); text-decoration: underline; font-size: 0.8125rem; }
.linkbtn.danger { color: var(--bad); }
.empty { padding: 18px 12px; color: var(--muted); }
@media (prefers-reduced-motion: reduce) { .bar > i { transition: none; } }
</style>

<div class="wrap">
  <header class="head">
    <div>
      <h1>Fifty Plates</h1>
      <p class="sub">Every state, its capital, and its nickname.</p>
    </div>
    <div class="meter" aria-live="polite">
      <div class="meter-row"><span><strong id="mCount">0</strong> of 100 facts mastered</span><span>Streak <strong id="mStreak">0</strong></span></div>
      <div class="bar"><i id="mBar"></i></div>
    </div>
  </header>

  <nav class="tabs" role="tablist" aria-label="Study mode">
    <button class="tab" role="tab" data-mode="cards" id="tab-cards">Flashcards</button>
    <button class="tab" role="tab" data-mode="quiz" id="tab-quiz">Quiz</button>
    <button class="tab" role="tab" data-mode="type" id="tab-type">Type it</button>
    <button class="tab" role="tab" data-mode="list" id="tab-list">All 50</button>
  </nav>

  <section id="practice" class="wrapless" style="display:contents">
    <div class="filters" id="filters">
      <div class="frow" id="askRow"><span class="flabel">Ask me</span></div>
      <div class="frow" id="regionRow"><span class="flabel">Region</span></div>
    </div>
    <div id="plateSlot"></div>
    <div class="controls" id="controls"></div>
  </section>

  <section id="list" hidden>
    <div style="display:flex;flex-direction:column;gap:14px">
      <div class="listbar">
        <input id="search" type="search" placeholder="Search a state, capital, or nickname" aria-label="Search">
        <button class="chip" id="hideCap" aria-pressed="false">Hide capitals</button>
        <button class="chip" id="hideNick" aria-pressed="false">Hide nicknames</button>
      </div>
      <div class="tablebox">
        <table>
          <thead><tr><th>State</th><th>Capital</th><th>Nickname</th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
      <div class="legend">
        <div style="display:flex;flex-wrap:wrap;gap:6px 18px">
          <span><i class="pip"></i>New</span><span><i class="pip b1"></i>Learning</span><span><i class="pip b3"></i>Mastered (3 right in a row)</span>
        </div>
        <span id="resetBox"><button class="linkbtn" id="resetBtn">Reset progress</button></span>
      </div>
    </div>
  </section>
</div>

<script>
// abbr, state, capital, nickname, region, extra accepted nicknames
const STATES = [
["AL","Alabama","Montgomery","Yellowhammer State","South"],
["AK","Alaska","Juneau","The Last Frontier","West"],
["AZ","Arizona","Phoenix","Grand Canyon State","West"],
["AR","Arkansas","Little Rock","The Natural State","South"],
["CA","California","Sacramento","Golden State","West"],
["CO","Colorado","Denver","Centennial State","West"],
["CT","Connecticut","Hartford","Constitution State","Northeast",["Nutmeg State"]],
["DE","Delaware","Dover","The First State","South"],
["FL","Florida","Tallahassee","Sunshine State","South"],
["GA","Georgia","Atlanta","Peach State","South"],
["HI","Hawaii","Honolulu","Aloha State","West"],
["ID","Idaho","Boise","Gem State","West"],
["IL","Illinois","Springfield","Prairie State","Midwest",["Land of Lincoln"]],
["IN","Indiana","Indianapolis","Hoosier State","Midwest"],
["IA","Iowa","Des Moines","Hawkeye State","Midwest"],
["KS","Kansas","Topeka","Sunflower State","Midwest"],
["KY","Kentucky","Frankfort","Bluegrass State","South"],
["LA","Louisiana","Baton Rouge","Pelican State","South"],
["ME","Maine","Augusta","Pine Tree State","Northeast"],
["MD","Maryland","Annapolis","Old Line State","South"],
["MA","Massachusetts","Boston","Bay State","Northeast"],
["MI","Michigan","Lansing","Great Lakes State","Midwest",["Wolverine State"]],
["MN","Minnesota","Saint Paul","North Star State","Midwest",["Land of 10,000 Lakes","Gopher State"]],
["MS","Mississippi","Jackson","Magnolia State","South"],
["MO","Missouri","Jefferson City","Show-Me State","Midwest"],
["MT","Montana","Helena","Treasure State","West",["Big Sky Country"]],
["NE","Nebraska","Lincoln","Cornhusker State","Midwest"],
["NV","Nevada","Carson City","Silver State","West"],
["NH","New Hampshire","Concord","Granite State","Northeast"],
["NJ","New Jersey","Trenton","Garden State","Northeast"],
["NM","New Mexico","Santa Fe","Land of Enchantment","West"],
["NY","New York","Albany","Empire State","Northeast"],
["NC","North Carolina","Raleigh","Tar Heel State","South"],
["ND","North Dakota","Bismarck","Peace Garden State","Midwest"],
["OH","Ohio","Columbus","Buckeye State","Midwest"],
["OK","Oklahoma","Oklahoma City","Sooner State","South"],
["OR","Oregon","Salem","Beaver State","West"],
["PA","Pennsylvania","Harrisburg","Keystone State","Northeast"],
["RI","Rhode Island","Providence","Ocean State","Northeast"],
["SC","South Carolina","Columbia","Palmetto State","South"],
["SD","South Dakota","Pierre","Mount Rushmore State","Midwest"],
["TN","Tennessee","Nashville","Volunteer State","South"],
["TX","Texas","Austin","Lone Star State","South"],
["UT","Utah","Salt Lake City","Beehive State","West"],
["VT","Vermont","Montpelier","Green Mountain State","Northeast"],
["VA","Virginia","Richmond","Old Dominion","South"],
["WA","Washington","Olympia","Evergreen State","West"],
["WV","West Virginia","Charleston","Mountain State","South"],
["WI","Wisconsin","Madison","Badger State","Midwest"],
["WY","Wyoming","Cheyenne","Equality State","West",["Cowboy State"]]
].map(([ab, name, cap, nick, region, alt]) => ({ ab, name, cap, nick, region, alt: alt || [] }));

// Each ask: what is shown, what is answered, and which fact (c = capital, n = nickname) it trains.
const ASKS = {
  sc: { chip: "State → Capital",  label: "What is the capital of",   show: "name", answer: "cap",  fact: "c" },
  cs: { chip: "Capital → State",  label: "Which state's capital is", show: "cap",  answer: "name", fact: "c" },
  sn: { chip: "State → Nickname", label: "What is the nickname of",  show: "name", answer: "nick", fact: "n" },
  ns: { chip: "Nickname → State", label: "Which state is called",    show: "nick", answer: "name", fact: "n" }
};
const REGIONS = ["All", "Northeast", "Midwest", "South", "West"];
const MODES = ["cards", "quiz", "type", "list"];
const KEY = "fifty-plates-v1";

let saved = {};
try { saved = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) {}
const progress = saved.progress || {};          // "AL:c" -> 0..3 correct in a row
let asks = (saved.asks || ["sc", "sn"]).filter(a => ASKS[a]);
if (!asks.length) asks = ["sc", "sn"];
let region = REGIONS.includes(saved.region) ? saved.region : "All";
let mode = MODES.includes(location.hash.slice(1)) ? location.hash.slice(1) : (MODES.includes(saved.mode) ? saved.mode : "cards");
let streak = 0, q = null, lastKey = "";
let hideCap = false, hideNick = false;
const shown = new Set();

const $ = id => document.getElementById(id);
const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };
const save = () => { try { localStorage.setItem(KEY, JSON.stringify({ progress, asks, region, mode })); } catch (e) {} };
const box = (s, fact) => progress[s.ab + ":" + fact] || 0;
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

function nextQuestion() {
  const pool = [];
  for (const s of STATES) {
    if (region !== "All" && s.region !== region) continue;
    for (const a of asks) pool.push({ s, ask: a, w: [8, 4, 2, 1][box(s, ASKS[a].fact)] });
  }
  // Facts you miss come back more often; never the same fact twice in a row.
  const usable = pool.length > 2 ? pool.filter(p => p.s.ab + ASKS[p.ask].fact !== lastKey) : pool;
  let r = Math.random() * usable.reduce((t, p) => t + p.w, 0), pick = usable[0];
  for (const p of usable) { r -= p.w; if (r <= 0) { pick = p; break; } }
  lastKey = pick.s.ab + ASKS[pick.ask].fact;
  const field = ASKS[pick.ask].answer;
  const others = shuffle(STATES.filter(s => s !== pick.s)).slice(0, 3).map(s => s[field]);
  q = { s: pick.s, ask: pick.ask, opts: shuffle([pick.s[field], ...others]), done: false, picked: null, verdict: null };
}

function grade(ok) {
  const k = q.s.ab + ":" + ASKS[q.ask].fact;
  progress[k] = ok ? Math.min(3, (progress[k] || 0) + 1) : 0;
  streak = ok ? streak + 1 : 0;
  save();
}

const norm = t => t.toLowerCase().replace(/\bsaint\b/g, "st").replace(/[^a-z0-9 ]/g, "").replace(/\s+/g, " ").trim()
  .replace(/^the /, "").replace(/ state$/, "").replace(/ /g, "");
function lev(a, b) {
  const d = Array.from({ length: a.length + 1 }, (_, i) => [i]);
  for (let j = 1; j <= b.length; j++) d[0][j] = j;
  for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++)
    d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
  return d[a.length][b.length];
}
function checkTyped(text) {
  const A = ASKS[q.ask], right = q.s[A.answer];
  const accepted = [right, ...(A.answer === "nick" ? q.s.alt : [])].map(norm);
  const t = norm(text);
  if (!t) return null;
  if (accepted.includes(t)) return { ok: true, msg: "Correct." };
  if (accepted.some(a => a.length > 5 && lev(a, t) <= (a.length > 9 ? 2 : 1))) return { ok: true, msg: "Correct. It is spelled " + right + "." };
  return { ok: false, msg: "Not quite. The answer is " + right + "." };
}

/* ---------- rendering ---------- */
function renderMeter() {
  const n = Object.values(progress).filter(b => b >= 3).length;
  $("mCount").textContent = n; $("mStreak").textContent = streak; $("mBar").style.width = n + "%";
}

function renderFilters() {
  const askRow = $("askRow"), regionRow = $("regionRow");
  askRow.querySelectorAll("button").forEach(b => b.remove());
  regionRow.querySelectorAll("button").forEach(b => b.remove());
  for (const a in ASKS) {
    const b = el("button", "chip", ASKS[a].chip);
    b.setAttribute("aria-pressed", asks.includes(a));
    b.onclick = () => {
      if (asks.includes(a)) { if (asks.length === 1) return; asks = asks.filter(x => x !== a); } else asks.push(a);
      save(); nextQuestion(); render();
    };
    askRow.append(b);
  }
  for (const r of REGIONS) {
    const b = el("button", "chip", r);
    b.setAttribute("aria-pressed", r === region);
    b.onclick = () => { region = r; save(); nextQuestion(); render(); };
    regionRow.append(b);
  }
}

function renderPlate() {
  const A = ASKS[q.ask], tappable = mode === "cards" && !q.done;
  const p = el(tappable ? "button" : "div", "plate");
  if (tappable) { p.id = "plateBtn"; p.onclick = reveal; }
  p.append(el("span", "p-ask", A.label), el("span", "p-main", q.s[A.show]), el("span", "p-rule"));
  if (q.done) {
    p.append(el("span", "p-ans", q.s[A.answer]), el("span", "p-foot", q.s.name + " · " + q.s.cap + " · " + q.s.nick));
  } else {
    p.append(el("span", "p-ans wait", mode === "cards" ? "Tap to show the answer" : "?"), el("span", "p-foot", ""));
  }
  $("plateSlot").replaceChildren(p);
}

function renderControls(focus) {
  const c = $("controls"); c.replaceChildren();
  const nextBtn = () => { const b = el("button", "btn primary", "Next"); b.id = "nextBtn"; b.onclick = advance; return b; };

  if (mode === "cards") {
    const row = el("div", "btnrow");
    if (!q.done) {
      const b = el("button", "btn primary", "Show answer"); b.id = "showBtn"; b.onclick = reveal; row.append(b);
      c.append(row, el("div", "hint keys", "Space shows the answer."));
    } else {
      const no = el("button", "btn no", "Missed it"), yes = el("button", "btn yes", "Got it");
      no.id = "missBtn"; yes.id = "gotBtn";
      no.onclick = () => { grade(false); advance(); }; yes.onclick = () => { grade(true); advance(); };
      row.append(no, yes);
      c.append(row, el("div", "hint keys", "← missed it, → got it."));
    }
  }

  if (mode === "quiz") {
    const right = q.s[ASKS[q.ask].answer], grid = el("div", "opts");
    q.opts.forEach((o, i) => {
      const b = el("button", "opt"); b.id = "opt" + (i + 1);
      b.append(el("kbd", null, String(i + 1)), el("span", null, o));
      if (q.done) { b.disabled = true; if (o === right) b.classList.add("right"); else if (o === q.picked) b.classList.add("wrong"); }
      else b.onclick = () => pick(o);
      grid.append(b);
    });
    c.append(grid);
    if (q.done) {
      c.append(el("div", "verdict " + (q.verdict.ok ? "good" : "bad"), q.verdict.msg));
      const row = el("div", "btnrow"); row.append(nextBtn()); c.append(row);
    } else c.append(el("div", "hint keys", "Press 1 to 4 to answer."));
  }

  if (mode === "type") {
    const form = el("form", "typeform"), input = el("input");
    input.id = "answerInput"; input.type = "text"; input.autocomplete = "off"; input.spellcheck = false;
    input.setAttribute("autocapitalize", "words");
    input.setAttribute("aria-label", "Your answer"); input.placeholder = "Type the " + ({ cap: "capital", nick: "nickname", name: "state" })[ASKS[q.ask].answer];
    if (q.done) { input.value = q.picked || ""; input.readOnly = true; }
    const b = el("button", "btn primary", q.done ? "Next" : "Check"); b.type = "submit"; b.id = "checkBtn";
    form.append(input, b);
    form.onsubmit = e => {
      e.preventDefault();
      if (q.done) return advance();
      const v = checkTyped(input.value); if (!v) return input.focus();
      q.picked = input.value; q.verdict = v; q.done = true; grade(v.ok); render(true);
    };
    c.append(form);
    if (q.done) c.append(el("div", "verdict " + (q.verdict.ok ? "good" : "bad"), q.verdict.msg));
    else {
      const skip = el("button", "linkbtn", "I don't know"); skip.type = "button"; skip.id = "skipBtn";
      skip.onclick = () => { q.picked = ""; q.verdict = { ok: false, msg: "The answer is " + q.s[ASKS[q.ask].answer] + "." }; q.done = true; grade(false); render(true); };
      const h = el("div", "hint"); h.append(skip); c.append(h);
    }
    if (focus) (q.done ? b : input).focus();
  }
  if (focus && mode === "quiz" && q.done) $("nextBtn").focus();
}

function renderList() {
  const term = $("search").value.trim().toLowerCase();
  const rows = STATES.filter(s => !term || (s.name + " " + s.cap + " " + s.nick + " " + s.ab).toLowerCase().includes(term));
  const body = $("rows"); body.replaceChildren();
  if (!rows.length) { const tr = el("tr"), td = el("td", "empty", "No state matches that search."); td.colSpan = 3; tr.append(td); body.append(tr); return; }
  for (const s of rows) {
    const tr = el("tr");
    tr.append(el("td", "st", s.name));
    for (const [fact, text, hidden] of [["c", s.cap, hideCap], ["n", s.nick, hideNick]]) {
      const td = el("td"), k = s.ab + fact, b = Math.min(3, box(s, fact));
      td.append(el("i", "pip" + (b ? " b" + b : "")));
      if (hidden && !shown.has(k)) {
        const btn = el("button", "cover", "Show");
        btn.setAttribute("aria-label", "Show " + (fact === "c" ? "capital" : "nickname") + " of " + s.name);
        btn.onclick = () => { shown.add(k); renderList(); };
        td.append(btn);
      } else td.append(text);
      tr.append(td);
    }
    body.append(tr);
  }
}

function render(focus) {
  document.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-selected", t.dataset.mode === mode));
  const isList = mode === "list";
  $("list").hidden = !isList;
  $("filters").hidden = $("plateSlot").hidden = $("controls").hidden = isList;
  renderMeter();
  if (isList) return renderList();
  renderFilters(); renderPlate(); renderControls(focus);
}

/* ---------- actions ---------- */
function reveal() { q.done = true; render(); $("gotBtn").focus(); }
function pick(o) {
  const right = q.s[ASKS[q.ask].answer], ok = o === right;
  q.picked = o; q.done = true; q.verdict = { ok, msg: ok ? "Correct." : "Not quite. The answer is " + right + "." };
  grade(ok); render(true);
}
function advance() { nextQuestion(); render(true); if (mode === "cards") $("plateBtn").focus({ preventScroll: true }); }
function setMode(m) { mode = m; save(); if (m !== "list") nextQuestion(); render(); }

document.querySelectorAll(".tab").forEach(t => t.onclick = () => setMode(t.dataset.mode));
$("search").oninput = renderList;
$("hideCap").onclick = e => { hideCap = !hideCap; shown.clear(); e.currentTarget.setAttribute("aria-pressed", hideCap); renderList(); };
$("hideNick").onclick = e => { hideNick = !hideNick; shown.clear(); e.currentTarget.setAttribute("aria-pressed", hideNick); renderList(); };

function resetPrompt(asking) {
  const boxEl = $("resetBox"); boxEl.replaceChildren();
  if (!asking) { const b = el("button", "linkbtn", "Reset progress"); b.id = "resetBtn"; b.onclick = () => resetPrompt(true); boxEl.append(b); return; }
  const yes = el("button", "linkbtn danger", "Yes, erase it"), no = el("button", "linkbtn", "Keep it");
  yes.onclick = () => { for (const k in progress) delete progress[k]; streak = 0; save(); resetPrompt(false); render(); };
  no.onclick = () => resetPrompt(false);
  boxEl.append("Erase all progress? ", yes, " · ", no);
}
resetPrompt(false);

document.addEventListener("keydown", e => {
  if (mode === "list" || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.target.matches("input, textarea")) return;
  const onBtn = e.target.matches("button");
  if (mode === "cards") {
    if (!q.done && (e.key === " " || e.key === "Enter") && !onBtn) { e.preventDefault(); reveal(); }
    else if (q.done && (e.key === "ArrowLeft" || e.key === "1")) { grade(false); advance(); }
    else if (q.done && (e.key === "ArrowRight" || e.key === "2")) { grade(true); advance(); }
  } else if (mode === "quiz") {
    if (!q.done && "1234".includes(e.key) && e.key.length === 1) pick(q.opts[+e.key - 1]);
    else if (q.done && e.key === "Enter" && !onBtn) advance();
  } else if (mode === "type" && q.done && e.key === "Enter" && !onBtn) advance();
});

nextQuestion();
render();
</script>
